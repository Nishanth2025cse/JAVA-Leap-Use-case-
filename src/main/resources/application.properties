# Server Port
server.port=8080

# Application Name
spring.application.name=municipal-wastewater-platform

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/water
spring.datasource.username=root
spring.datasource.password=Nishanth@sece
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring MVC Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.example.wastewater=DEBUG
