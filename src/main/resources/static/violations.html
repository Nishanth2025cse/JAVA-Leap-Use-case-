<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Violations - Waste Water Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="top-navbar-container"></div>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Environmental COD Exceedance Violations</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Factory Name</th>
                                    <th>COD Measured</th>
                                    <th>Permitted Limit</th>
                                    <th>Excess COD</th>
                                    <th>Compliance Fine</th>
                                    <th>Violation Date</th>
                                    <th>Billing Status</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody id="violations-tbody">
                                <tr><td colspan="9" style="text-align:center;">Loading environmental violations...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/violations.js"></script>
</body>
</html>
