<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Suppliers - Waste Water Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="top-navbar-container"></div>

            <div class="content-body">
                <div class="action-header">
                    <h2>Chemical Suppliers & Vendor Registry</h2>
                    <button class="btn btn-primary" onclick="openSupplierModal()">+ Register Supplier</button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Chemical Agent Vendors & Suppliers</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Supplier Name</th>
                                    <th>Contact Person</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Tax Number</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="suppliers-tbody">
                                <tr><td colspan="8" style="text-align:center;">Loading suppliers...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supplier Modal -->
    <div class="modal-overlay" id="supplierModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="card-title" id="supplierModalTitle">Register Supplier</h3>
                <button class="logout-btn" onclick="closeModal('supplierModal')">✕</button>
            </div>
            <form id="supplierForm">
                <div class="modal-body">
                    <input type="hidden" id="supplierId">
                    <div class="form-group">
                        <label class="form-label">Supplier Name *</label>
                        <input type="text" id="supplierName" class="form-control" required placeholder="e.g. Aqua Chemicals Pvt Ltd">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Contact Person</label>
                            <input type="text" id="supplierContact" class="form-control" placeholder="Rajesh Sharma">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="text" id="supplierPhone" class="form-control" placeholder="+91-...">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="supplierEmail" class="form-control" placeholder="vendor@chemicals.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tax Number</label>
                            <input type="text" id="supplierTaxNumber" class="form-control" placeholder="TAX-99882">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <input type="text" id="supplierAddress" class="form-control" placeholder="Industrial Estate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('supplierModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Vendor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/suppliers.js"></script>
</body>
</html>
