<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Municipal Waste Water & Effluent Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">💧</div>
            <h2>AquaPulse Platform</h2>
            <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">Municipal Smart Wastewater & Effluent Monitoring</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required value="admin">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required value="admin123">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
                Sign In to Platform ➔
            </button>
        </form>

        <div style="margin-top: 24px; padding: 16px; background-color: var(--primary-light); border-radius: var(--radius-md); font-size: 12px; color: var(--text-secondary);">
            <strong style="color: var(--primary-hover); display: block; margin-bottom: 6px;">🔑 Quick Demo Credentials:</strong>
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span><strong>Admin/Controller:</strong></span>
                <code onclick="fillCreds('admin', 'admin123')" style="cursor: pointer; color: var(--primary); font-weight: 700;">admin / admin123</code>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span><strong>Accountant:</strong></span>
                <code onclick="fillCreds('accountant', 'acc123')" style="cursor: pointer; color: var(--primary); font-weight: 700;">accountant / acc123</code>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetchAPI('/auth/login', {
                    method: 'POST',
                    body: { username, password }
                });

                if (response) {
                    localStorage.setItem('userSession', JSON.stringify({
                        username: response.username,
                        fullName: response.fullName,
                        role: response.role
                    }));
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                }
            } catch (err) {
                // Handled in fetchAPI
            }
        });
    </script>
</body>
</html>
